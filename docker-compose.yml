version: "3.8"

services:
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo

  worker:
    build: .
    container_name: worker
    command: python -m app.worker
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:7
    container_name: redis

  mongo:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"